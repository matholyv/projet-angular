<header class="main-header glass-header">
  <div class="header-container container">
    <!-- Logo (Toulouse Violet Style) -->
    <a routerLink="/" class="logo">
      <span class="logo-2nd">2nd</span><span class="logo-main">main</span>
    </a>

    <!-- Vinted-style Search Capsule -->
    <div class="search-wrapper">
      <div class="search-capsule">
        <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M12.9 14.32a8 8 0 111.41-1.41l5.35 5.33-1.42 1.42-5.33-5.34zM8 14A6 6 0 108 2a6 6 0 000 12z" clip-rule="evenodd" />
        </svg>
        <input type="text" placeholder="Rechercher des articles (Vêtements, Maison...)" class="search-input">
      </div>
    </div>

    <!-- Actions -->
    <nav class="header-nav">
      <!-- Dark Mode Toggle -->
      <button class="nav-btn theme-toggle" (click)="toggleTheme()" aria-label="Mode Sombre/Clair">
        <svg *ngIf="!isDarkMode" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="theme-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
        <svg *ngIf="isDarkMode" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="theme-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>
      </button>

      <ng-container *ngIf="currentUser$ | async as user; else notLogged">
        <span class="user-greeting">Bonjour, <strong>{{ $any(user).pseudo || $any(user).email?.split('@')[0] }}</strong></span>
        <button class="nav-btn btn-ghost" (click)="logout()">Déconnexion</button>
      </ng-container>

      <ng-template #notLogged>
        <button class="nav-btn btn-ghost" routerLink="/login">S'inscrire | Se connecter</button>
      </ng-template>

      <button class="nav-btn btn-primary capsule" routerLink="/publish">Vendre</button>
    </nav>
  </div>
</header>
