<article class="ad-card" [routerLink]="['/ad', id]" style="cursor: pointer;">
  <!-- En-tête : Vendeur -->
  <div class="ad-card-header">
    <div class="avatar-placeholder">
      <svg *ngIf="!authorPseudo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
      </svg>
    </div>
    <span class="author-name">{{ authorPseudo || 'Utilisateur' }}</span>
  </div>

  <!-- Image de l'annonce avec bouton favori overlay -->
  <div class="ad-card-image-wrapper">
    <!-- Bouton Favori (Cœur) -->
    <button class="favorite-btn" [class.is-favorite]="isFavorite" (click)="toggleFavorite($event)" title="Ajouter aux favoris">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" [attr.fill]="isFavorite ? '#ef4444' : 'none'">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
      </svg>
    </button>
    <img *ngIf="imageUrl" [src]="imageUrl" [alt]="title" class="ad-image">
    <div *ngIf="!imageUrl" class="no-image-placeholder">
      <span>Pas de photo</span>
    </div>
  </div>

  <!-- Informations produit -->
  <div class="ad-card-info">
    <span class="ad-price">{{ price }} €</span>
    <div class="ad-meta">
      <span class="ad-condition text-uppercase">{{ condition || 'Bon état' }}</span>
      <span class="ad-size" *ngIf="size">• {{ size }}</span>
      <span class="ad-brand" *ngIf="brand" style="display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">{{ brand }}</span>
    </div>
    <h3 class="ad-title">{{ title || 'Titre de l\'annonce' }}</h3>
  </div>
</article>
