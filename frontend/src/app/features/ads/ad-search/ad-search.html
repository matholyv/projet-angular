<div class="search-page-container fade-in">

  <!-- En-tête Titre/Keywords -->
  <div class="search-header">
    <h1 *ngIf="!filterForm.value.keyword">Toutes les annonces</h1>
    <h1 *ngIf="filterForm.value.keyword">Résultats pour "{{ filterForm.value.keyword }}"</h1>
    <p>{{ searchResults.length }} résultats trouvés</p>
  </div>

  <div class="search-layout">
    
    <!-- Sidebar : Filtres -->
    <aside class="filters-sidebar">
      <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="filters-form">
        
        <div class="filter-group">
          <label for="keyword">Chercher un article</label>
          <input type="text" id="keyword" formControlName="keyword" placeholder="ex: Pull, Vase...">
        </div>

        <div class="filter-group">
          <label for="category">Catégorie</label>
          <select id="category" formControlName="category">
            <option value="">Toutes</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Prix (€)</label>
          <div class="price-inputs">
            <input type="number" formControlName="minPrice" placeholder="Min" min="0">
            <span> - </span>
            <input type="number" formControlName="maxPrice" placeholder="Max" min="0">
          </div>
        </div>

        <div class="filter-actions">
          <button type="submit" class="btn-primary full-width">Appliquer</button>
          <button type="button" class="btn-ghost full-width mt-1" (click)="resetFilters()">Effacer</button>
        </div>
      </form>
    </aside>

    <!-- Main Content : Grille de Résultats -->
    <main class="results-grid">
      <app-ad-card 
        *ngFor="let ad of searchResults"
        [title]="ad.title"
        [price]="ad.price"
        [condition]="ad.condition"
        [imageUrl]="ad.imageUrl"
        [authorPseudo]="ad.authorPseudo"
      ></app-ad-card>
    </main>

  </div>
</div>
