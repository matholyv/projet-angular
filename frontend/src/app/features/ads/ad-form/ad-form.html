<div class="ad-creation-wrapper">
  
  <div class="form-container fade-in">
    <h2>Vends ton article</h2>
    
    <form [formGroup]="adForm" (ngSubmit)="onSubmit()" class="ad-form">
      
      <!-- Zone Upload (Multimédia) -->
      <div class="form-section upload-section">
        
        <!-- Grille des images déjà ajoutées -->
        <div class="images-grid" *ngIf="imagePreviews.length > 0">
          <div class="image-preview-wrapper" *ngFor="let preview of imagePreviews; let i = index">
            <img [src]="preview" alt="Aperçu" class="preview-img">
            
            <button type="button" class="btn-remove" (click)="removeImage(i)" title="Supprimer">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>

            <!-- Bouton pour passer en photo principale (caché sur l'id 0) -->
            <button *ngIf="i !== 0" type="button" class="btn-set-main" (click)="setMainImage(i, $event)">
              Définir comme principale
            </button>

            <div class="main-photo-badge" *ngIf="i === 0">Photo principale</div>
          </div>
        </div>

        <!-- Zone Drag & Drop (toujours visible si < 20 images) -->
        <div 
          class="drag-drop-zone" 
          [class.dragging]="isDragging"
          [class.small-dropzone]="imagePreviews.length > 0"
          *ngIf="imagePreviews.length < 20"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
          (click)="fileInput.click()"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="upload-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          <p *ngIf="imagePreviews.length === 0">Ajoute jusqu'à 20 photos<br><span class="small-hint">Glisse tes photos ici ou clique</span></p>
          <p *ngIf="imagePreviews.length > 0">Ajouter une photo</p>
        </div>

        <input type="file" #fileInput hidden accept="image/*" multiple (change)="onFileSelected($event)">
      </div>

      <!-- Détails de l'article -->
      <div class="form-section group">
        
        <!-- Titre -->
        <div class="form-control">
          <label for="title">Titre</label>
          <input id="title" type="text" formControlName="title" placeholder="ex: Chemise Zara taille M">
          <div class="error-msg" *ngIf="adForm.get('title')?.touched && adForm.get('title')?.invalid">
            Titre requis (minimum 3 caractères).
          </div>
        </div>

        <!-- Description -->
        <div class="form-control">
          <label for="description">Décris ton article</label>
          <textarea id="description" formControlName="description" rows="4" placeholder="ex: Porté quelques fois, taille correctement..."></textarea>
          <div class="error-msg" *ngIf="adForm.get('description')?.touched && adForm.get('description')?.invalid">
            Description requise.
          </div>
        </div>

        <!-- Catégorie, État & Prix (Flex Row) -->
        <div class="form-row">
          <div class="form-control">
            <label for="category">Catégorie</label>
            <select id="category" formControlName="categoryId" (change)="onCategoryChange($event)">
              <option value="" disabled selected>Choisis une catégorie</option>
              <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
            </select>
          </div>

          <!-- Champ État -->
          <div class="form-control">
            <label for="condition">État de l'article</label>
            <select id="condition" formControlName="condition">
              <option *ngFor="let cond of conditions" [value]="cond">{{ cond }}</option>
            </select>
          </div>

          <!-- Champ Taille Dynamique -->
          <div class="form-control animate-fade" *ngIf="selectedCategory?.hasSize">
            <label for="size">Taille</label>
            <select id="size" formControlName="size">
              <option value="" disabled selected>Sélectionne la taille</option>
              <option *ngFor="let s of selectedCategory.sizes" [value]="s">{{ s }}</option>
            </select>
            <div class="error-msg" *ngIf="adForm.get('size')?.touched && adForm.get('size')?.invalid">
              Taille requise.
            </div>
          </div>

          <div class="form-control">
            <label for="price">Prix</label>
            <div class="price-input">
              <input id="price" type="number" formControlName="price" placeholder="0.00" min="1">
              <span class="currency">€</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Validation -->
      <div class="form-actions">
        <button type="submit" class="btn-primary capsule submit-btn">Mettre en ligne</button>
      </div>

    </form>
  </div>

  <!-- Aperçu en Direct (Live Preview) -->
  <aside class="live-preview-container fade-in">
    <h3>Aperçu de ton annonce</h3>
    <div class="preview-card-wrapper">
      <app-ad-card
        [title]="adForm.value.title || 'Titre de l\'article'"
        [price]="adForm.value.price || 0"
        [condition]="adForm.value.condition"
        [size]="adForm.value.size"
        [imageUrl]="imagePreviews.length > 0 ? imagePreviews[0] : ''"
        [authorPseudo]="$any(currentUser)?.pseudo || $any(currentUser)?.email?.split('@')[0] || 'Vendeur'"
      ></app-ad-card>
    </div>
    <p class="preview-hint">C'est ce que les autres membres verront dans les résultats de recherche.</p>
  </aside>

</div>
