<div class="ad-detail-container fade-in">
  <div class="ad-grid">
    
    <!-- Partie Gauche : Image du produit -->
    <div class="ad-image-section">
      <div class="main-image-wrapper">
        <img [src]="ad.imageUrl" [alt]="ad.title" class="main-image" *ngIf="ad.imageUrl">
        <div class="no-image-placeholder" *ngIf="!ad.imageUrl">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="48" height="48">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <p>Aucune photo</p>
        </div>
      </div>
    </div>

    <!-- Partie Droite : Infos & Actions -->
    <div class="ad-info-section">
      
      <!-- Fiche Produit -->
      <div class="product-box content-section">
        <h1 class="ad-title">{{ ad.title }}</h1>
        <h2 class="ad-price">{{ ad.price }} €</h2>
        
        <hr class="divider">

        <div class="ad-attributes">
          <div class="detail-row">
            <span class="detail-label">Catégorie</span>
            <span class="detail-value">{{ ad.categoryName }}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Publié le</span>
            <span class="detail-value">{{ ad.createdAt | date:'longDate':'':'fr-FR' }}</span>
          </div>
        </div>

        <hr class="divider">

        <h3 class="desc-title">Description</h3>
        <p class="ad-description">{{ ad.description }}</p>
      </div>

      <!-- Vendeur Card -->
      <div class="seller-box content-section">
        <div class="seller-header">
          <div class="avatar">
            <svg *ngIf="!ad.author.avatarUrl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
            </svg>
          </div>
          <div>
            <span class="seller-name">{{ ad.author.pseudo }}</span>
          </div>
        </div>
        
        <!-- Call To Action (Messagerie) -->
        <button class="btn-primary capsule full-width mt-2" (click)="onContactSeller()">
          Contacter le vendeur
        </button>
      </div>

    </div>

  </div>
</div>
