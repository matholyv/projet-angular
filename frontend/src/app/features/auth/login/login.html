<div class="auth-wrapper fade-in">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Heureux de vous revoir !</h2>
      <p class="auth-subtitle">Connectez-vous pour retrouver vos pépites ou vendre vos articles.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-control">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="exemple@domaine.com">
        <div class="error-msg" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Veuillez entrer une adresse email valide.
        </div>
      </div>

      <div class="form-control">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••">
        <div class="error-msg" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Mot de passe (minimum 6 caractères).
        </div>
      </div>

      <button type="submit" class="btn-primary capsule full-width mt-1">Se connecter</button>
    </form>

    <div class="auth-footer">
      <p>Pas encore de compte ? <a routerLink="/register" class="auth-link">Inscrivez-vous ici</a></p>
    </div>
  </div>
</div>
